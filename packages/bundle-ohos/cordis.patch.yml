# @dsh-ohos/bundle —— OHOS 适配层（叠加在 dsh-base 与 dsh-web-app 之后）。
#
# 只允许三类操作（见 specs/105-upstream-adapter-bundle/spec.md）：
#   1) 按 id 禁用上游行；
#   2) 按 id 覆盖上游行的 config；
#   3) 插入本工程提供的行。
# 不允许复制上游行内容，也不允许改写上游源码。

# ── 配置热重载：设备上无意义，且增加 fs 压力 ────────────────────────────────
- id: hmr
  disabled: true

# ── 进程/命令：换成 OHOS 实现（禁用上游行后插入同名服务的新提供方）──────────
- id: subprocess
  disabled: true

- id: sandbox
  disabled: true

- id: bash-sandbox
  disabled: true

- id: pwsh-sandbox
  disabled: true

# 策略层保留（纯配置，无内核依赖）；workspaceRoot 必须显式覆盖：
# 上游默认是 process.cwd()，而设备上 cwd 是 "/"。
- id: sandbox-policy
  config:
    # 与上游 approval 行同源：避免出现「策略 workspace-write + 审批 never」的矛盾组合。
    mode: !!js process.env.DSH_PERMISSION_MODE ?? 'workspace-write'
    workspaceRoot: !!js process.env.DSH_OHOS_WORKSPACE

# ── 目录选择：禁用 auto（它会动态挂载客户端面），静态挂 browse 原语 ─────────
- id: directory-picker
  disabled: true

# ── 外部打开：换成 OHOS Want 实现 ──────────────────────────────────────────
- id: open-in-app
  disabled: true

# ── 审批预设：需要"可隔离的执行器"（ctx.shell.sandboxMode 非空）───────────────
# 鸿蒙没有内核隔离，我们的 shell 执行器如实不声明 sandboxMode；上游 permission-presets
# 把这种组合判为误配置并拒绝挂载 ⇒ 明确禁用，而不是伪造一个 sandboxMode（宪法 C2）。
- id: permission
  disabled: true

# ── 品牌与首次引导：按本产品身份交付，不把上游的预览提示与官方引导带给用户 ────────
# 上游把这三处写死在界面/组件里，这里只用它自己的两个配置口 + 一个禁用口：
#   ① `ui-settings-general.welcomeNoticeVersion` = 上游当前版本 ⇒ 预览提示视为已致谢
#      （`WelcomeNotice` 仅当该值 ≠ 上游 `WELCOME_NOTICE_VERSION` 时弹出；本值由
#      `scripts/verify-upstream.mjs` 对齐上游常量，上游改版本会先红，不静默漂移）；
#   ② `ui-settings-models.credentialOnboarding: false` ⇒ DeepSeek 首次配置对话框不再
#      自动弹出；组件保留，用户仍可从设置里手动进入（能力没被删掉，只去掉自动打扰）；
#   ③ `ui-brand-official` 是上游的「官方 DeepSeek 品牌位」——本产品用自己的品牌位
#      （`@dsh-ohos/branding`），并禁止构建环境切成 official 时冒出上游官方标识。
- id: ui-settings-general
  config:
    welcomeNoticeVersion: '2026-09-28.1'

- id: ui-settings-models
  config:
    credentialOnboarding: false

- id: ui-brand-official
  disabled: true

- insert:
    # 进程与命令
    - id: subprocess-ohos
      name: '@dsh-ohos/subprocess'
    - id: sandbox-ohos
      name: '@dsh-ohos/sandbox'
    - id: shell-ohos
      name: '@dsh-ohos/shell'
      config:
        timeoutMs: 120000
        shellPath: /system/bin/sh

    # 目录选择器的客户端面：上游 directory-picker-auto 会动态挂载 backend+surface 这一对；
    # 我们把 host 面换成 workspace-picker 后必须显式钉住客户端面（否则「选择工作区」点击无反应）。
    # 用本工程自己的对话框：三 Tab（沙箱/文档/下载）+ 权限门（未授权时只显示「请求权限/刷新」），
    # 上游 browse 对话框没有 Tab，也无法表达「点 Tab 不申请权限」。
    - id: workspace-picker-client
      name: '@dsh-ohos/workspace-picker-client'

    # 工作区选择（三根：沙箱 / 文档 / 下载；「桌面」已移除——它需要需 ACL 的
    # READ_WRITE_DESKTOP_DIRECTORY，见 docs/ACL配置.md）。
    # 注意：browse 与 workspace-picker 都注册 ctx.directoryPicker，同层插入会触发 cordis 的
    # 重复服务错误 ⇒ 原语由 workspace-picker 自实现，不再委派 browse 后端。
    - id: workspace-picker
      name: '@dsh-ohos/workspace-picker'
      config:
        sandboxRoot: !!js process.env.DSH_OHOS_WORKSPACE
        userRoot: /storage/Users/currentUser
        roots:
          - documents
          - download

    # 204-plugin-git：设备没有 git 二进制，把纯 JS 的 isomorphic-git 嵌入宿主进程。
    # 这一行同时交付两件事：
    #   ① 21 个 git 工具注册进 ctx.tools（宿主平面，对 agent 可见）；
    #   ② dsh.client 声明被 client-modules 扫描到，「Git 凭据」设置页进入启动图。
    # isomorphic-git 闭包由 scripts/assemble-payload.mjs 的 collectGitRuntime() 物化到
    # node_modules/@dsh-ohos/git/node_modules/（嵌套，避免覆盖载荷顶层的 pako 等同名包）。
    - id: git
      name: '@dsh-ohos/git'

    # 201-dsh-market / 012-pnpm-integration：插件市场的进程内安装通道。
    # 这一行只提供 desktopProfiles / desktopPnpm 两个服务（dsh-market 用 ctx.get 特性检测），
    # pnpm 引擎由 scripts/assemble-payload.mjs 的 collectMarketPNPM() 物化到
    # node_modules/dsh-market-pnpm，运行期在 worker 线程内执行（不 spawn 子进程）。
    # 必须在 dshmarket 行（profile bundles 末位）之前激活，市场才能检测到契约。
    - id: market-ohos
      name: '@dsh-ohos/market'
    # 宿主通知与诊断
    - id: notify-ohos
      name: '@dsh-ohos/notify'
    - id: facts-ohos
      name: '@dsh-ohos/facts'
      config:
        enabled: false

    # 外部打开：宿主桥 shell.openExternal（ArkTS Want）；上游 open-in-app 行已在上方禁用。
    - id: open-in-app-ohos
      name: '@dsh-ohos/open-in-app'
      config:
        probeTimeoutMs: 10000
        iconTimeoutMs: 10000
        launchWatchMs: 1000

    # 图像：sharp 替身是模块级重定向（S4），不是 cordis 插件；
    # 这一行以 disabled 形式登记替换目标，避免被当作可 apply 的插件加载。
    - id: attachment-image-ohos
      name: '@dsh-ohos/attachment-image'
      disabled: true

    # 品牌位（205-plugin-branding）：侧栏 logo/名称、会话空态 hero 品牌位、页面标题。
    # 零补丁实现：Host 半边用 `webServer.tapIndex` + `webserver/index-inject`，
    # 浏览器半边占用 `sidebar.brand.mark` / `sidebar.brand.name` / `conversation.hero.brand.mark`。
    - id: branding-ohos
      name: '@dsh-ohos/branding'
