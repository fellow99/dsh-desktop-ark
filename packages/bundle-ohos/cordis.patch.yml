# @dsh-ohos/bundle —— OHOS 适配层（叠加在 dsh-base 与 dsh-web-app 之后）。
#
# 只允许三类操作（见 specs/105-upstream-adapter-bundle/spec.md）：
#   1) 按 id 禁用上游行；
#   2) 按 id 覆盖上游行的 config；
#   3) 插入本工程提供的行。
# 不允许复制上游行内容，也不允许改写上游源码。

# ── 配置热重载：设备上无意义，且增加 fs 压力 ────────────────────────────────
- id: hmr
  disabled: true

# ── 进程/命令：换成 OHOS 实现（禁用上游行后插入同名服务的新提供方）──────────
- id: subprocess
  disabled: true

- id: sandbox
  disabled: true

- id: bash-sandbox
  disabled: true

- id: pwsh-sandbox
  disabled: true

# 策略层保留（纯配置，无内核依赖）；workspaceRoot 必须显式覆盖：
# 上游默认是 process.cwd()，而设备上 cwd 是 "/"。
- id: sandbox-policy
  config:
    # 与上游 approval 行同源：避免出现「策略 workspace-write + 审批 never」的矛盾组合。
    mode: !!js process.env.DSH_PERMISSION_MODE ?? 'workspace-write'
    workspaceRoot: !!js process.env.DSH_OHOS_WORKSPACE

# ── 目录选择：禁用 auto（它会动态挂载客户端面），静态挂 browse 原语 ─────────
- id: directory-picker
  disabled: true

# ── 外部打开：换成 OHOS Want 实现 ──────────────────────────────────────────
- id: open-in-app
  disabled: true

# ── 审批预设：需要"可隔离的执行器"（ctx.shell.sandboxMode 非空）───────────────
# 鸿蒙没有内核隔离，我们的 shell 执行器如实不声明 sandboxMode；上游 permission-presets
# 把这种组合判为误配置并拒绝挂载 ⇒ 明确禁用，而不是伪造一个 sandboxMode（宪法 C2）。
- id: permission
  disabled: true

- insert:
    # 进程与命令
    - id: subprocess-ohos
      name: '@dsh-ohos/subprocess'
    - id: sandbox-ohos
      name: '@dsh-ohos/sandbox'
    - id: shell-ohos
      name: '@dsh-ohos/shell'
      config:
        timeoutMs: 120000
        shellPath: /system/bin/sh

    # 四主目录工作区选择（host 面 + client 面）
    # 注意：browse 与 workspace-picker 都注册 ctx.directoryPicker，同层插入会触发 cordis 的
    # 重复服务错误 ⇒ browse 由 workspace-picker 在隔离作用域内自挂。
    - id: workspace-picker
      name: '@dsh-ohos/workspace-picker'
      config:
        sandboxRoot: !!js process.env.DSH_OHOS_WORKSPACE
        userRoot: /storage/Users/currentUser
        roots:
          - desktop
          - documents
          - download

    # 宿主通知与诊断
    - id: notify-ohos
      name: '@dsh-ohos/notify'
    - id: facts-ohos
      name: '@dsh-ohos/facts'
      config:
        enabled: false

    # 外部打开：宿主桥 shell.openExternal（ArkTS Want）；上游 open-in-app 行已在上方禁用。
    - id: open-in-app-ohos
      name: '@dsh-ohos/open-in-app'
      config:
        probeTimeoutMs: 10000
        iconTimeoutMs: 10000
        launchWatchMs: 1000

    # 图像：sharp 替身是模块级重定向（S4），不是 cordis 插件；
    # 这一行以 disabled 形式登记替换目标，避免被当作可 apply 的插件加载。
    - id: attachment-image-ohos
      name: '@dsh-ohos/attachment-image'
      disabled: true
